<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF1F0"/><stop offset="100%" stop-color="#E4E9E7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#mg)"/>
  <!-- parks -->
  <path d="M60 40 h150 v110 h-150 z" fill="#D9E7D6" opacity=".85"/>
  <path d="M640 380 h210 v150 h-210 z" fill="#D9E7D6" opacity=".85"/>
  <circle cx="300" cy="470" r="70" fill="#D9E7D6" opacity=".8"/>
  <!-- water -->
  <path d="M0 300 C 140 262, 250 340, 400 316 C 560 290, 660 350, 900 320 L900 356 C 660 388, 560 328, 400 352 C 250 376, 140 300, 0 338 Z" fill="#CFE0EA"/>
  <!-- minor streets -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".95">
    <path d="M0 90 H900"/><path d="M0 190 H900"/><path d="M0 420 H900"/><path d="M0 490 H900"/>
    <path d="M120 0 V560"/><path d="M260 0 V560"/><path d="M430 0 V560"/>
    <path d="M580 0 V560"/><path d="M730 0 V560"/><path d="M840 0 V560"/>
  </g>
  <!-- major roads -->
  <g stroke="#F6C99B" stroke-width="14" stroke-linecap="round">
    <path d="M0 250 H900"/><path d="M500 0 V560"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 12" opacity=".8">
    <path d="M0 250 H900"/><path d="M500 0 V560"/>
  </g>
  <!-- ring road -->
  <path d="M170 460 C 90 330, 150 150, 330 110 C 520 68, 720 130, 790 260 C 840 356, 790 470, 660 520"
        fill="none" stroke="#F3D3A6" stroke-width="12" stroke-linecap="round"/>
  <!-- blocks -->
  <g fill="#DDE3E1" opacity=".9">
    <rect x="140" y="210" width="90" height="26" rx="4"/>
    <rect x="290" y="290" width="110" height="20" rx="4"/>
    <rect x="600" y="120" width="100" height="46" rx="4"/>
    <rect x="760" y="200" width="70" height="30" rx="4"/>
    <rect x="180" y="330" width="60" height="60" rx="4"/>
  </g>
  <!-- pin: office -->
  <g transform="translate(430,232)">
    <ellipse cx="0" cy="6" rx="16" ry="5" fill="#0E1B2B" opacity=".18"/>
    <path d="M0 0 C -18 -22, -26 -32, -26 -46 A26 26 0 0 1 26 -46 C 26 -32, 18 -22, 0 0 Z" fill="#EE4A24"/>
    <circle cx="0" cy="-47" r="10" fill="#fff"/>
  </g>
  <!-- pin: warehouse -->
  <g transform="translate(548,318)">
    <ellipse cx="0" cy="6" rx="14" ry="4" fill="#0E1B2B" opacity=".18"/>
    <path d="M0 0 C -15 -19, -22 -27, -22 -39 A22 22 0 0 1 22 -39 C 22 -27, 15 -19, 0 0 Z" fill="#17A2A2"/>
    <circle cx="0" cy="-40" r="8.5" fill="#fff"/>
  </g>
  <rect x="0" y="0" width="900" height="560" fill="#0E1B2B" opacity="0.03"/>
</svg>
